services:
  postgres:
    image: postgres:16-alpine
    container_name: novaai-postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-novaai}
      POSTGRES_USER: ${DATABASE_USERNAME:-novaai}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-novaai}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-novaai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: novaai-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME:-novaai}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-novaai}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-novaai}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_SYSTEM_PROMPT: ${AI_SYSTEM_PROMPT:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
